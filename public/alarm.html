<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <meta name="description" content="A calm medicine reminder with a family voice message.">
    <title>Time for your medicine — SentiDose</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Inter:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages.css">
  </head>
  <body class="elder">
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="header-holder"></div>

    <main id="main" class="container alarm-main">
      <section class="card alarm-card" aria-labelledby="alarm-title">
        <p class="alarm-time chip chip--due">
          <span data-icon="clock" data-size="18"></span>
          <span id="alarm-time">Time for your medicine</span>
        </p>

        <h1 class="alarm-med" id="alarm-title">Metformin 500 mg</h1>
        <p class="alarm-dose" id="alarm-note"></p>

        <div id="alarm-voice"></div>

        <div class="alarm-actions">
          <button class="btn btn--success btn--block" type="button" id="alarm-took">
            <span data-icon="check-circle" data-size="28"></span> I took it
          </button>
          <button class="btn btn--secondary btn--block" type="button" id="alarm-snooze">
            <span data-icon="clock" data-size="28"></span> Remind me in 10 minutes
          </button>
          <button class="btn btn--ghost btn--block" type="button" id="alarm-skip">Skip this dose</button>
        </div>

        <p class="alarm-foot" id="alarm-foot">Family is told if you skip.</p>
      </section>
    </main>

    <script src="/js/icons.js"></script>
    <script src="/js/store.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/alarm.js"></script>
  </body>
</html>
