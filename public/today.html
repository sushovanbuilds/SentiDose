<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f766e">
    <meta name="description" content="Today's medicines for Dadu, one clear dose at a time.">
    <title>Today — SentiDose</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages.css">
  </head>
  <body class="elder">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app-loader" id="app-loader" role="status" aria-live="polite">
      <span class="app-loader__icon app-loader__icon--pulse" aria-hidden="true">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
          <path d="M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08c.82.82 2.13.85 3 .07l2.07-1.9a2.82 2.82 0 0 1 3.79 0l2.96 2.66"/>
          <path d="m18 15-2-2"/>
          <path d="m15 18-2-2"/>
        </svg>
      </span>
      <p class="app-loader__message">Getting your care space ready…</p>
    </div>
    <div id="header-holder"></div>

    <div class="shell">
      <div id="nav-holder"></div>

      <main id="main" tabindex="-1" class="container page-main">
        <div class="today-head">
          <h1 class="today-head__greeting" id="greeting">Good morning, Dadu</h1>
          <p class="today-head__date" id="today-date"></p>
        </div>

        <div class="elder-grid">
          <div>
            <section id="next-dose" aria-labelledby="next-dose-title" class="card">
              <div class="next-card__top">
                <h2 class="next-card__label" id="next-dose-title">Next medicine</h2>
                <span id="next-dose-status"></span>
              </div>
              <p class="next-card__med" id="next-med-name"></p>
              <p class="next-card__when" id="next-med-when"></p>

              <div id="voice-holder"></div>

              <div class="next-card__actions">
                <button class="btn btn--success btn--block" type="button" id="took-it">
                  <span data-icon="check-circle" data-size="24"></span> I took it
                </button>
                <button class="btn btn--secondary btn--block" type="button" id="snooze">
                  <span data-icon="clock" data-size="24"></span> Remind me in 10 minutes
                </button>
              </div>
              <p class="confirmed" id="confirm-note" hidden></p>
            </section>

            <section aria-labelledby="later-title">
              <h2 class="section-title" id="later-title">Later today</h2>
              <ul class="timeline card" id="later-list" aria-busy="true"></ul>
            </section>
          </div>

          <div>
            <section aria-labelledby="ask-title" class="card">
              <h2 class="section-title section-title--flush" id="ask-title">Ask SentiDose</h2>
              <button class="btn btn--secondary btn--block" type="button" id="speak" aria-describedby="speak-hint">
                <span data-icon="mic" data-size="28"></span> Press to speak
              </button>
              <p class="field__hint" id="speak-hint" aria-live="polite">Tap to speak with family or ask about your pills.</p>
            </section>

            <section aria-labelledby="appt-title">
              <h2 class="section-title" id="appt-title">Next appointment</h2>
              <div class="card" id="next-appt" aria-busy="true"></div>
            </section>
          </div>
        </div>
      </main>
    </div>

    <script src="/js/errors.js" defer></script>
    <script src="/js/loading.js" defer></script>
    <script src="/js/icons.js" defer></script>
    <script src="/js/store.js" defer></script>
    <script src="/js/clock.js" defer></script>
    <script src="/js/ui.js" defer></script>
    <script src="/js/api.js" defer></script>
    <script src="/js/today.js" defer></script>
  </body>
</html>
